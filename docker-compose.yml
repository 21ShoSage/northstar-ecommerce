services:
  db:
    image: postgres:16-alpine
    container_name: northstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: northstar_store
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_password
    ports:
      - "5432:5432"
    volumes:
      - northstar_pgdata:/var/lib/postgresql/data
volumes:
  northstar_pgdata:
